[project]
name = "iec61850-websocket"
version = "1.0.0"
description = "This project is a proof-of-concept (PoC) that exposes IEC 61850 information and events to modern applications using WebSockets."

readme = "README.md"
requires-python = ">=3.10"

license = "Apache-2.0"
license-files = [
    "LICENSE"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "asn1tools ==0.167.0",
    "websockets == 16.0",
    "bitstruct == 8.21.0",
    "certifi== 2026.1.4",
    "cffi == 2.0.0",
    "charset-normalizer == 3.4.4",
    "cryptography == 46.0.2",
    "idna == 3.11",
    "pycparser == 2.23",
    "pyjwt == 2.10.1",
    "pyparsing == 3.2.5",
    "requests == 2.32.5",
    "urllib3 == 2.6.3",
    "aiohttp == 3.13.3",
    "flask>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest >= 9.0.0",
    "pytest-asyncio >= 1.3.0",
    "black >= 24.0.0",
    "ruff >= 0.6.0",
    "flask === 3.1.2"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
#need refactoring to start a single client/server
#ws61850-server = "ws61850.iec61850.server.ws_server:main"
#ws61850-client = "ws61850.iec61850.client.ws_client:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

markers = [
    "unit: fast unit tests",
    "integration: integration tests",
    "performance: performance and load tests",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.uv]
package = true