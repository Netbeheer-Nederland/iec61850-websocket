[project]
name = "iec61850-websocket"
version = "1.0.0"
description = "This project is a proof-of-concept (PoC) that exposes IEC 61850 information and events to modern applications using WebSockets."

readme = "README.md"
requires-python = ">=3.10"

license = "Apache-2.0"
license-files = [
    "LICENSE"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "asn1tools (==0.167.0)",
    "websockets (==15.0.1)",
    "bitstruct (==8.21.0)",
    "certifi (==2025.10.5)",
    "cffi (==2.0.0)",
    "charset-normalizer (==3.4.4)",
    "cryptography (==46.0.2)",
    "idna (==3.11)",
    "pycparser (==2.23)",
    "pyjwt (==2.10.1)",
    "pyparsing (==3.2.5)",
    "requests (==2.32.5)",
    "urllib3 (==2.5.0)",
    "aiohttp (==3.13.2)"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "black>=24.0.0",
    "ruff>=0.6.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
