services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak-dev
    command: [ "start-dev", "--import-realm" ]
    ports:
      - "8081:8081"
      - "8443:8443"
    environment:
      KC_HOSTNAME: localhost
      # HTTP on 8081, inside and outside the container: 8080 is the rti-demo HMI.
      # One port everywhere keeps the token issuer the same for the host and
      # for containers (http://localhost:8081/realms/...).
      KC_HTTP_PORT: 8081
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/server.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/server-key.pem
    volumes:
      - ./data:/opt/keycloak/data/import
      - ../../testing/certs/keycloak.pem:/opt/keycloak/conf/server.pem
      - ../../testing/certs/keycloak-key.pem:/opt/keycloak/conf/server-key.pem
    networks:
      - rti-network

networks:
  rti-network:
    external: true