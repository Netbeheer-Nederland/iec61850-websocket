<div class="acsi-server-page">


        <section class="acsi-panel acsi-panel-main" id="acsi-api-logs-panel">
            <div class="protocol-header">
                <h2>Protocol Messages</h2>
                <div class="message-controls">
                    <select class="monitor-interval-select" id="messages-interval">
                        <option value="1000">1s</option>
                        <option value="2000">2s</option>
                        <option value="5000" selected>5s</option>
                        <option value="10000">10s</option>
                    </select>
                    <button id="messages-start-btn" class="btn-primary" type="button" title="Start">
                        <i class="fas fa-play"></i>
                        Start
                    </button>
                    <button id="reloadMessagesBtn" title="Reload Messages" class="btn-primary" type="button" aria-label="Reload Messages">
                        <i class="fas fa-rotate-right" aria-hidden="true"></i>
                        Reload
                    </button>
                    <button id="messages-stop-btn" class="btn-primary" type="button" title="Stop">
                        <i class="fas fa-stop"></i>
                        Stop
                    </button>
                    <button id="messages-clear-btn" class="btn-primary" type="button" title="Clear">
                        <i class="fas fa-trash"></i>
                        Clear
                    </button>
                </div>
                <div class="monitor-status" id="messages-status">Select an endpoint and click Start</div>
            </div>
            <div id="acsi-protocol-messages" class="acsi-log-list"></div>
        </section>
    </div>

</div>
