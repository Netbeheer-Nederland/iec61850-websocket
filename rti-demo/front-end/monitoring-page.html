<div class="page-header">
    <h1>Messages Monitoring</h1>
    <p class="section-description">Monitor messages from two endpoints simultaneously</p>
</div>
<div class="monitoring-workspace">
    <!-- Monitor Block 1 -->
    <div class="monitor-block">
        <div class="monitor-header">
            <h3>Monitor 1</h3>
            <div class="monitor-controls">
                <select class="monitor-endpoint-select" id="monitor1-endpoint">
                    <option value="">Select Endpoint</option>
                </select>
                <select class="monitor-interval-select" id="monitor1-interval">
                    <option value="1000">1s</option>
                    <option value="2000">2s</option>
                    <option value="5000" selected>5s</option>
                    <option value="10000">10s</option>
                </select>
                <button class="btn-icon monitor-control-btn" id="monitor1-start" title="Start">
                    <i class="fas fa-play"></i>
                </button>
                <button class="btn-icon monitor-control-btn" id="monitor1-pause" title="Pause" disabled>
                    <i class="fas fa-pause"></i>
                </button>
                <button class="btn-icon monitor-control-btn" id="monitor1-clear" title="Clear">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
        <div class="monitor-messages" id="monitor1-messages"></div>
        <div class="monitor-status" id="monitor1-status">Select an endpoint and click Start</div>
    </div>
    
    <!-- Monitor Block 2 -->
    <div class="monitor-block">
        <div class="monitor-header">
            <h3>Monitor 2</h3>
            <div class="monitor-controls">
                <select class="monitor-endpoint-select" id="monitor2-endpoint">
                    <option value="">Select Endpoint</option>
                </select>
                <select class="monitor-interval-select" id="monitor2-interval">
                    <option value="1000">1s</option>
                    <option value="2000">2s</option>
                    <option value="5000" selected>5s</option>
                    <option value="10000">10s</option>
                </select>
                <button class="btn-icon monitor-control-btn" id="monitor2-start" title="Start">
                    <i class="fas fa-play"></i>
                </button>
                <button class="btn-icon monitor-control-btn" id="monitor2-pause" title="Pause" disabled>
                    <i class="fas fa-pause"></i>
                </button>
                <button class="btn-icon monitor-control-btn" id="monitor2-clear" title="Clear">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
        <div class="monitor-messages" id="monitor2-messages"></div>
        <div class="monitor-status" id="monitor2-status">Select an endpoint and click Start</div>
    </div>
</div>
