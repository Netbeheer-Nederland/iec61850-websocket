<div>
      <div class="acsi-log-tabs" role="tablist" aria-label="Log tabs">
                <button id="scl-model-factory-btn" class="acsi-log-tab active" type="button" role="tab" aria-selected="true">SCL Model Factory</button>
                <button id="api-btn" class="acsi-log-tab" type="button" role="tab" aria-selected="false">API</button>
            </div>
            <div id="scl-model-factory-tab" class="acsi-log-tab-panel active" role="tabpanel">
                <div class="page-header" >
                    <h1>SCL Model Loader</h1>
                    <p class="section-description">Load an SCL file to view and analyze the IEC 61850 model structure</p>
                </div>
                <div class="tools-workspace">
                    <div class="tools-control-panel">
                        <h3>Actions</h3>
                        <p class="tools-helper-text">Select an SCL file, inspect the parsed tree, and generate the Python model.</p>

                        <input id="tools-sclFile" class="tools-file-input" type="file" accept=".scl,.scd,.cid,.icd,.xml">

                        <div class="tools-action-buttons">
                            <label for="tools-sclFile" class="btn-action tools-action-btn" role="button" tabindex="0">
                                <i class="fas fa-folder-open"></i>
                                <span id="tools-browseBtnText">Browse SCL File</span>
                            </label>

                            <div id="tools-iedSelectWrap" class="tools-select-wrap">
                                <label for="tools-iedSelect">IED</label>
                                <select id="tools-iedSelect" class="tools-select"></select>
                            </div>

                            <div id="tools-apSelectWrap" class="tools-select-wrap">
                                <label for="tools-apSelect">Access Point</label>
                                <select id="tools-apSelect" class="tools-select"></select>
                            </div>

                            <button id="tools-generateModelBtn" class="btn-action tools-action-btn" type="button">
                                <i class="fas fa-file-code"></i>
                                <span>Generate model.py</span>
                            </button>
                        </div>

                        <div id="tools-statusInfo" class="tools-status-info"></div>
                    </div>

                    <div class="tools-tree-panel">
                        <h3>SCL Model Structure</h3>
                        <div id="tools-modelPanel" class="panel-content tree"></div>
                    </div>
                </div>
            </div>
            <div id="api-tab" class="acsi-log-tab-panel" role="tabpanel hidden">
                <section class="acsi-panel acsi-panel-main" id="acsi-api-tester">
                    <h2>API Tester</h2>
                    <div class="acsi-api-controls">

                        <label class="acsi-label" for="acsi-api-select">Endpoint</label>
                        <select id="endpoint-api-select" class="acsi-select"></select>

                        <label class="acsi-label" for="acsi-api-select">API</label>
                        <select id="api-select" class="acsi-select"></select>

                        <label class="acsi-label" for="acsi-api-body">Request Body (JSON, optional)</label>
                        <textarea id="acsi-api-body" class="acsi-textarea" rows="6" placeholder="{\n  \"objRef\": \"LD0.LLN0.Mod.stVal\",\n  \"fc\": \"ST\"\n}"></textarea>

                        <button id="acsi-api-run" class="btn-primary" type="button">
                            <i class="fas fa-play"></i>
                            Run API
                        </button>
                    </div>
                </section>
                <section class="acsi-panel acsi-panel-main" id="acsi-api-logs-panel">
            <h2>Log Messages</h2>
            <div class="acsi-log-tabs" role="tablist" aria-label="Log tabs">
                <button id="acsi-log-tab-api-btn" class="acsi-log-tab active" type="button" role="tab" aria-selected="true">API Logs</button>
            </div>
            <div id="acsi-log-tab-api" class="acsi-log-tab-panel active" role="tabpanel">
                <div id="acsi-api-logs" class="acsi-log-list"></div>
            </div>
        </section>
            </div>
</div>
