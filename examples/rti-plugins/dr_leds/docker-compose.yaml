# The sample plugin dr_leds, its own stack (decision 0030). It joins the
# external network rti-network, so the FSPs and SO reach it as
# http://dr-leds:8099/plugin.
#
#   docker network create rti-network 2>/dev/null || true
#   docker compose up -d
#
# It has no hardware, so it has no docker-compose.pi.yaml. The port is
# published on 127.0.0.1; set DR_LEDS_BIND=0.0.0.0 to reach it from the LAN.
services:
  dr-leds:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${RTI_IMAGE_REPO:-netbeheernederland/iec61850-websocket}/dr-leds:${RTI_IMAGE_TAG:-latest}
    container_name: dr-leds
    environment:
      - DR_LEDS_CLAIMS=${DR_LEDS_CLAIMS:-}
    ports:
      - "${DR_LEDS_BIND:-127.0.0.1}:${DR_LEDS_PORT:-8099}:8099"
    networks:
      - rti-network
    restart: unless-stopped

networks:
  rti-network:
    external: true
