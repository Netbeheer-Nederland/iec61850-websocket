# The IO server, rti-io: the Raspberry Pi's LEDs, buttons, potentiometers and
# displays (decision 0028). Its own stack, apart from the rti-demo's: it runs
# on the Pi, the FSPs, SO, BFF and HMI can run anywhere. Both join the
# external network rti-network, so on one Docker host the IO plugin in the
# FSPs and SO reaches it as http://rti-io:9000.
#
#   docker network create rti-network 2>/dev/null || true
#   docker compose up -d
#
# Without the Pi's devices (a laptop, a CI runner), layer
# docker-compose.no-devices.yml over this file.
services:
  rti-io:
    image: ${RTI_IMAGE_REPO:-netbeheer-nederland/iec61850-websocket}/rti-io:${RTI_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PI_USER: ${PI_USER:-pi}
        PI_UID: ${PI_UID:-1000}
        PI_GID: ${PI_GID:-1000}
        GPIO_GID: ${GPIO_GID:-986}
        I2C_GID: ${I2C_GID:-988}
        SPI_GID: ${SPI_GID:-989}
    container_name: rti-io
    ports:
      - "9000:9000"
    # PORT/PYTHONUNBUFFERED already set (matching defaults) by the Dockerfile.
    user: ${PI_USER:-pi}  # User with gpio group access
    group_add:
      - "gpio"
      - "i2c"
      - "spi"
    devices:
      - "/dev/gpiochip0:/dev/gpiochip0"
      - "/dev/gpiochip4:/dev/gpiochip4"
      - "/dev/gpiochip10:/dev/gpiochip10"
      - "/dev/gpiochip11:/dev/gpiochip11"
      - "/dev/gpiochip12:/dev/gpiochip12"
      - "/dev/gpiochip13:/dev/gpiochip13"
      - "/dev/i2c-1:/dev/i2c-1"
      - "/dev/i2c-13:/dev/i2c-13"
      - "/dev/i2c-14:/dev/i2c-14"
      - "/dev/spidev0.0:/dev/spidev0.0"
      - "/dev/spidev0.1:/dev/spidev0.1"
    ipc: host
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_RAWIO
    networks:
      - rti-network
    # Health check already defined in the Dockerfile.
    labels:
      - "rti.service=rti-io"
      - "rti.type=RTI-IO"
      - "rti.host=rti-io"
      - "rti.port=9000"

networks:
  rti-network:
    external: true
