services:
  bff-server:
    build:
      context: ..
      dockerfile: Dockerfile.bff
    container_name: bff-server
    ports:
      - "5000:5000"
    environment:
      - RTI_DOCKER_ENABLED=true
      - RTI_SERVICE_DISCOVERY_ENABLED=true
      - PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ../bff:/app/bff
      - ../connections.json:/app/connections.json
      - //var/run/docker.sock:/var/run/docker.sock
    networks:
      - rti-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    labels:
      - "rti.service=bff-server"
      - "rti.type=RTI-BFF"
      - "rti.host=bff-server"
      - "rti.port=5000"

  hmi:
    build:
      context: ../hmi
      dockerfile: Dockerfile
    container_name: rti-hmi
    ports:
      - "8080:80"
    depends_on:
      bff-server:
        condition: service_healthy
    networks:
      - rti-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  rti-network:
    driver: bridge
