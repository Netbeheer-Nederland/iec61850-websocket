version: '3.8'

services:
  # BFF Server
  bff-server:
    build:
      context: ..
      dockerfile: Dockerfile.bff
    container_name: bff-server
    ports:
      - "5000:5000"
    environment:
      - RTI_DOCKER_ENABLED=true
      - RTI_SERVICE_DISCOVERY_ENABLED=true
      - PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ../bff:/app/bff
      - ../connections.json:/app/connections.json
      - //var/run/docker.sock:/var/run/docker.sock
    networks:
      - rti-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    labels:
      - "rti.service=bff-server"
      - "rti.type=RTI-BFF"
      - "rti.host=bff-server"
      - "rti.port=5000"

  # Frontend Web Server (HMI)
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    container_name: rti-demo-ui
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ../front-end:/app
    depends_on:
      bff-server:
        condition: service_healthy
    networks:
      - rti-network
    environment:
      - REACT_APP_BFF_URL=http://<BFF_IP>:5000

networks:
  rti-network:
    driver: bridge
