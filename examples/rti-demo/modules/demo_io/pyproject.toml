[project]
name = "demo-io"
version = "0.1.0"
description = "RTI Demo IO service (Raspberry Pi GPIO/I2C device control API)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.1",
    "Adafruit-ADS1x15",
    "asn1tools>=0.167.0",
    "docker==6.1.0",
    "fastapi>=0.139.0",
    "gpiozero",
    "gpiod",
    "smbus2",
    "httpx2>=2.13.0",
    "PyJWT>=2.0.0,<3.0.0",
    "python-multipart>=0.0.32",
    "requests==2.31.0",
    "uvicorn>=0.51.0",
    "websockets>=16.1",
]
