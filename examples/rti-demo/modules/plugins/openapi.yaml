#
# The ACSI plugin contract (decisions 0021, 0027, 0029), for third parties
# writing a plugin. tests/test_openapi.py checks it against the routes in
# src/acsi_plugins/web.py, what src/acsi_plugins/remote.py sends, and the
# events in src/acsi_plugins/contract.py.
openapi: 3.1.0
info:
  title: ACSI plugins
  version: "2"
  summary: The plugin API a plugin implements, and how the RTI Demo FSP and SO connect to and manage plugins.
  description: |
    The FSP and SO host plugins that link ACSI to another integration (IO hardware, a message bus,
    a historian, ...). **A plugin is an HTTP service**, in any language, that implements the
    **Plugin API** below. The FSP or SO connects to it; nothing of the plugin is installed in the FSP or
    SO. Decision 0029 describes the design.

    | Tag | Who serves it | What it is |
    |---|---|---|
    | **Plugin API** | **you**, at the plugin's base URL | what the FSP or SO calls: describe, start, stop, events, control, attached |
    | **Plugin management** | the FSP (port 5001) or SO (port 5000) | list, add, reload and remove plugins |
    | **Plugin routes** | the FSP or SO, for the plugin | the plugin's own routes, passed on under `/api/plugins/{name}/` |

    ### How a plugin is connected

    1. The FSP or SO reads its **plugin configuration** (`PluginsConfig`): a JSON file named by
       `PLUGINS_FILE`, or the same JSON inline in `PLUGINS`. It lists each plugin's `name`, base `url`
       and `settings`, and `host_url`, where plugins reach this FSP or SO.
    2. At startup it calls `GET <url>` (the plugin describes itself) and `POST <url>/start`. A plugin
       that can't be reached is listed in `GET /api/plugins` as failed and tried again every
       `PLUGIN_RETRY_SECONDS` (10 s); the FSP or SO starts without it.
    3. While it runs, it sends every event to `POST <url>/events`, and, in the FSP, an Operate on an
       objRef the plugin claims to `POST <url>/control`. When its plugin list is asked for, it asks
       `GET <url>/attached` what the plugin attaches (at most once a second), for the HMI (decision 0025).
    4. On removal, reload or shutdown it calls `POST <url>/stop`.

    | Call | Limit | When it fails |
    |---|---|---|
    | `GET <url>` | 5 s | not connected; tried again later |
    | `POST <url>/events` | 5 s | logged; the plugin is marked unhealthy, still gets the next event |
    | `POST <url>/control` | 2 s | the Operate fails |
    | `GET <url>/attached` | 1 s | the last items stay, with `attached_error`; optional (`404`: attaches nothing) |

    Every call but `GET <url>` names the FSP or SO it comes from (`Host`), so one plugin service can
    serve several FSPs and SOs.

    ### Contract version

    This is version **2** (`acsi_plugins.API_VERSION`). A plugin's description must say `"api": 2`;
    the FSP and SO refuse any other value. Version 1 was the in-process Python contract.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://localhost:5001
    description: FSP
  - url: http://localhost:5000
    description: SO

tags:
  - name: Plugin API
    description: |
      **Implemented by you.** The paths are relative to the plugin's base URL, the `url` in the plugin
      configuration (for example `http://rpi-io:9000/plugin`). Answer with a 2xx status; any other
      status is a failure. Request bodies are JSON.
  - name: Plugin management
    description: Served by the FSP and SO.
  - name: Plugin routes
    description: A plugin's own routes, passed on by the FSP or SO to the plugin.

paths:
  # ==================== Plugin API (implemented by the plugin) ====================

  /:
    servers: &pluginServers
      - url: "{plugin_url}"
        description: The plugin's base URL, as in the plugin configuration.
        variables:
          plugin_url:
            default: http://localhost:8099/plugin
    get:
      tags: [Plugin API]
      operationId: pluginDescribe
      summary: Describe the plugin
      description: |
        Called when the plugin is connected and on reload. `name` must be the name in the plugin
        configuration. `claims` are the objRefs whose Operate this plugin answers; at most one plugin
        per objRef, so a plugin claiming an objRef another one owns is refused.
      responses:
        "200":
          description: What the plugin is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginDescription"
              example:
                name: io
                version: 0.1.0
                api: 2
                claims: []
                routes: /api/io

  /start:
    servers: *pluginServers
    post:
      tags: [Plugin API]
      operationId: pluginStart
      summary: Start serving an FSP or SO
      description: |
        Called once per FSP or SO, after the description, with that host's settings. A plugin that
        writes back to the FSP or SO (for example input changes) uses `host_url`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
            example:
              name: io
              role: fsp
              host_url: http://rti-fsp01:5001
              settings: {}
      responses:
        "200":
          description: Started.
        "204":
          description: Started.

  /stop:
    servers: *pluginServers
    post:
      tags: [Plugin API]
      operationId: pluginStop
      summary: Stop serving an FSP or SO
      description: Called when the FSP or SO removes or reloads the plugin, or shuts down.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Host"
      responses:
        "200":
          description: Stopped.
        "204":
          description: Stopped.

  /events:
    servers: *pluginServers
    post:
      tags: [Plugin API]
      operationId: pluginEvent
      summary: Something happened in the FSP or SO
      description: |
        Every event goes to every plugin. Answer within 5 s; to do longer work (blink an LED), answer
        first (`202`) and do it afterwards. Ignore event types you don't know: new ones may be added
        without a new contract version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRequest"
            example:
              host: { name: io, role: fsp, host_url: http://rti-fsp01:5001 }
              event: { type: ValueWritten, obj_ref: LD0/GGIO1.SPCSO1.stVal, value: true, ok: true }
      responses:
        "200":
          description: Handled.
        "202":
          description: Accepted; handled afterwards.
        "204":
          description: Handled.

  /control:
    servers: *pluginServers
    post:
      tags: [Plugin API]
      operationId: pluginControl
      summary: Answer an Operate on a claimed objRef (FSP only)
      description: |
        The FSP asks while it builds its answer to the client, so this has 2 s. The answer is the
        ACSI answer: `ok`, or a failure with its `add_cause`. `204` leaves the Operate to the FSP's own
        check. Any other status, a timeout, or a body that isn't a `ControlResult` fails the Operate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlRequest"
      responses:
        "200":
          description: The plugin's answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlResult"
              example: { ok: false, add_cause: blockedByInterlocking }
        "204":
          description: No answer; the FSP checks the Operate itself.

  /attached:
    servers: *pluginServers
    get:
      tags: [Plugin API]
      operationId: pluginAttached
      summary: What the plugin attaches (optional)
      description: |
        What the plugin links its FSP or SO to (an IO server, a display, an IED), for the HMI to draw next
        to the FSP or SO (decision 0025). Optional: a plugin without it answers `404` and attaches
        nothing. Asked when the FSP's or SO's plugin list is asked for (the BFF does every 2 s), at most
        once a second, with 1 s to answer: answer with what you know, don't ask other services first.

        The FSP or SO checks and trims the answer: at most 4 items, 4 `live` blocks per item, and the
        limits in `AttachedLive`; an item without a `label` or with an unknown `kind` or `state`, and a
        block of an unknown `type`, are dropped; an unknown `color` becomes `white`. Everything is shown
        as plain text.
      responses:
        "200":
          description: What the plugin attaches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attached"
              example:
                items:
                  - kind: io
                    label: IO server
                    address: http://rpi-io:9000
                    state: ok
                    detail: 6 devices
                    live:
                      - type: indicators
                        items: [{ name: led1, "on": true, color: green }]
                      - type: values
                        items: [{ label: pot1, value: 42.0, unit: "%" }]
                  - kind: display
                    label: lcd1
                    state: ok
                    live:
                      - type: text
                        lines: ["FSP Connected: cp1"]
        "404":
          description: The plugin attaches nothing.

  # ==================== Plugin management (FSP and SO) ====================

  /api/plugins:
    get:
      tags: [Plugin management]
      operationId: listPlugins
      summary: List plugins
      description: The connected plugins, and the configured ones that aren't connected (yet), with why.
      responses:
        "200":
          description: The plugins.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginList"
    post:
      tags: [Plugin management]
      operationId: addPlugin
      summary: Add a plugin
      description: |
        Connect the plugin at `url` now, until the FSP or SO stops. The `url` must be under one in
        `PLUGIN_ALLOWED_SOURCES` (none by default): scheme, host and port equal, and the allowed path a
        whole-segment prefix. To keep a plugin, put it in the plugin configuration instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallRequest"
      responses:
        "200":
          $ref: "#/components/responses/PluginChanged"
        "403":
          $ref: "#/components/responses/SourceNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/PluginFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/plugins/{name}:
    parameters:
      - $ref: "#/components/parameters/PluginName"
    get:
      tags: [Plugin management]
      operationId: getPlugin
      summary: A plugin's status
      responses:
        "200":
          description: The plugin's status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginStatus"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Plugin management]
      operationId: removePlugin
      summary: Remove a plugin
      description: |
        Stop the plugin (`POST <url>/stop`) and free its objRefs. A configured plugin comes back when
        the FSP or SO starts again.
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/plugins/{name}/reload:
    parameters:
      - $ref: "#/components/parameters/PluginName"
    post:
      tags: [Plugin management]
      operationId: reloadPlugin
      summary: Reload a plugin
      description: |
        Stop the plugin, ask it again what it is, and start it again; the settings stay. Because this
        route comes first, a plugin can't have its own `POST /reload`.
      responses:
        "200":
          $ref: "#/components/responses/PluginChanged"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/PluginFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  # ==================== Plugin routes ====================

  /api/plugins/{name}/{path}:
    summary: A plugin's own routes
    description: |
      Every request under `/api/plugins/{name}/` (other than `POST .../reload`) is passed on, with its
      method, query, headers and body, to `<routes>/{path}`, where `routes` is the base the plugin
      gives in its description. The plugin's answer is returned as it is. For example, the IO server
      gives `/api/io`, so `/api/plugins/io/leds` reaches its `/api/io/leds`.

      Methods passed on: GET, POST, PUT, PATCH, DELETE.
    parameters:
      - $ref: "#/components/parameters/PluginName"
      - name: path
        in: path
        required: true
        description: The path within the plugin's routes, without the leading `/`. May contain `/`.
        schema:
          type: string
        example: leds
    get:
      tags: [Plugin routes]
      operationId: pluginRouteGet
      summary: GET a plugin route
      responses: &pluginRouteResponses
        default:
          description: Whatever the plugin's route answers.
        "404":
          description: No plugin with that name and routes is connected, or the plugin has no such route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The plugin can't be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Plugin routes]
      operationId: pluginRoutePost
      summary: POST to a plugin route
      requestBody: &pluginRouteBody
        required: false
        description: Passed on to the plugin as it is.
        content:
          "*/*":
            schema: {}
      responses: *pluginRouteResponses
    put:
      tags: [Plugin routes]
      operationId: pluginRoutePut
      summary: PUT to a plugin route
      requestBody: *pluginRouteBody
      responses: *pluginRouteResponses
    patch:
      tags: [Plugin routes]
      operationId: pluginRoutePatch
      summary: PATCH a plugin route
      requestBody: *pluginRouteBody
      responses: *pluginRouteResponses
    delete:
      tags: [Plugin routes]
      operationId: pluginRouteDelete
      summary: DELETE a plugin route
      responses: *pluginRouteResponses

components:
  parameters:
    PluginName:
      name: name
      in: path
      required: true
      description: The plugin's name.
      schema:
        $ref: "#/components/schemas/PluginName"
      example: io

  responses:
    PluginChanged:
      description: The plugin is connected and started.
      content:
        application/json:
          schema:
            type: object
            required: [ok, plugin]
            properties:
              ok:
                const: true
              plugin:
                $ref: "#/components/schemas/PluginStatus"
    NotFound:
      description: No plugin with that name.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { detail: "No plugin 'io' is loaded" }
    SourceNotAllowed:
      description: The plugin's URL isn't in `PLUGIN_ALLOWED_SOURCES`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: http://10.0.0.5:8099/plugin is not allowed; add it to PLUGIN_ALLOWED_SOURCES
    Conflict:
      description: A plugin with that name is connected already, or the plugin claims an objRef another plugin owns.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: "Plugin 'historian' claims objRefs another plugin owns: LD0/CSWI1.Pos.Oper.ctlVal (owned by 'io')"
    PluginFailed:
      description: |
        The plugin can't be reached, or doesn't answer as the Plugin API says (`detail` says why: a
        connection error, another name, another `api` version, an HTTP error from `/start`), or the
        request body isn't valid (`detail` is then FastAPI's list of validation errors).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ValidationError"
    InternalError:
      description: Anything else that went wrong.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ==================== Plugin API ====================

    PluginName:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      description: Lowercase letters, digits and `_`, starting with a letter. Served under `/api/plugins/<name>/`.
      examples: [io]

    PluginDescription:
      type: object
      description: What `GET <url>` answers. Other fields are ignored.
      required: [name, api]
      properties:
        name:
          $ref: "#/components/schemas/PluginName"
        version:
          type: string
          description: Shown in the plugin's status.
          examples: [1.0.0]
        api:
          const: 2
          description: The plugin API version the plugin implements.
        claims:
          type: array
          default: []
          items:
            type: string
          description: The objRefs whose Operate this plugin answers (`/control`), FSP only.
          examples: [["LD0/CSWI1.Pos.Oper.ctlVal"]]
        routes:
          type: [string, "null"]
          description: |
            Where the plugin's own routes are, served under `/api/plugins/<name>/`: a URL, or a path
            resolved against the plugin's base URL (`/api/io` on `http://rpi-io:9000/plugin` is
            `http://rpi-io:9000/api/io`). Leave out for none.
          examples: [/api/io]

    Host:
      type: object
      description: The FSP or SO a call comes from.
      required: [name, role]
      properties:
        name:
          $ref: "#/components/schemas/PluginName"
          description: The name this FSP or SO gives the plugin.
        role:
          enum: [fsp, so]
        host_url:
          type: [string, "null"]
          description: Where the plugin reaches this FSP or SO's REST API; null when it isn't configured.
          examples: ["http://rti-fsp01:5001"]

    StartRequest:
      allOf:
        - $ref: "#/components/schemas/Host"
        - type: object
          required: [settings]
          properties:
            settings:
              type: object
              additionalProperties: true
              description: The plugin's settings, from the plugin configuration.

    EventRequest:
      type: object
      required: [host, event]
      properties:
        host:
          $ref: "#/components/schemas/Host"
        event:
          $ref: "#/components/schemas/Event"

    ControlRequest:
      type: object
      required: [host, obj_ref, ctl_val]
      properties:
        host:
          $ref: "#/components/schemas/Host"
        obj_ref:
          type: string
          examples: [LD0/CSWI1.Pos.Oper.ctlVal]
        ctl_val:
          type: object
          additionalProperties: true
          description: |
            The ctlVal as the ACSI library has it, for example
            `{"type": "boolean", "value": ["boolean", true]}`.

    ControlResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        add_cause:
          type: [string, "null"]
          description: |
            When `ok` is false, the IEC 61850 `ControlServiceStatusKind` name sent to the client, for
            example `blockedByInterlocking`. An unknown name is sent as `unknown`.
          examples: [blockedByInterlocking]

    Event:
      description: |
        Something that happened in the FSP or SO. `x-roles` says which of them sends it. Match on
        `type`, and ignore types you don't know.
      oneOf:
        - $ref: "#/components/schemas/Associated"
        - $ref: "#/components/schemas/OperateReceived"
        - $ref: "#/components/schemas/OperateResponse"
        - $ref: "#/components/schemas/ValueWritten"
        - $ref: "#/components/schemas/ValueRead"
        - $ref: "#/components/schemas/ReportReceived"
        - $ref: "#/components/schemas/ServerStopped"
      discriminator:
        propertyName: type

    Associated:
      x-roles: [fsp, so]
      type: object
      description: An association was set up (the FSP answered it, or the SO got the answer).
      required: [type, associate_id]
      properties:
        type: { const: Associated }
        associate_id: { type: string }

    OperateReceived:
      x-roles: [fsp]
      type: object
      description: The FSP received an Operate request.
      required: [type, data]
      properties:
        type: { const: OperateReceived }
        data:
          type: object
          additionalProperties: true
          description: The request as received.

    OperateResponse:
      x-roles: [fsp, so]
      type: object
      description: An Operate was answered (FSP sent it; SO received it).
      required: [type, success, add_cause, obj_ref, value, data]
      properties:
        type: { const: OperateResponse }
        success: { type: boolean }
        add_cause: { type: [string, "null"] }
        obj_ref: { type: [string, "null"] }
        value: {}
        data:
          type: object
          additionalProperties: true

    ValueWritten:
      x-roles: [fsp, so]
      type: object
      description: A value was written (FSP, its own model; SO, to a server).
      required: [type, obj_ref, value, ok]
      properties:
        type: { const: ValueWritten }
        obj_ref: { type: string }
        value: {}
        ok: { type: boolean }

    ValueRead:
      x-roles: [so]
      type: object
      description: The SO read a value from a server.
      required: [type, obj_ref, value, ok]
      properties:
        type: { const: ValueRead }
        obj_ref: { type: string }
        value: {}
        ok: { type: boolean }

    ReportReceived:
      x-roles: [so]
      type: object
      description: The SO received a report.
      required: [type, rpt_id, data_set, data]
      properties:
        type: { const: ReportReceived }
        rpt_id: { type: string }
        data_set: { type: string }
        data:
          type: array
          items: {}

    ServerStopped:
      x-roles: [fsp]
      type: object
      description: The FSP is about to drop its connection to the SO (Disconnect); its ACSI server keeps running, ready (decision 0033). It waits for the plugins (up to 5 s).
      required: [type]
      properties:
        type: { const: ServerStopped }

    # ==================== Plugin management ====================

    InstallRequest:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          description: The plugin's name, as it describes itself.
          examples: [io]
        url:
          type: string
          description: The plugin's base URL.
          examples: ["http://rpi-io:9000/plugin"]
        settings:
          type: object
          additionalProperties: true
          default: {}
          description: The plugin's settings, sent with `/start`.

    Attached:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/AttachedItem"

    AttachedItem:
      type: object
      required: [kind, label]
      properties:
        kind:
          enum: [io, ied, display, other]
          description: What it is; the HMI's icon.
        label:
          type: string
          maxLength: 80
          examples: [IO server]
        address:
          type: [string, "null"]
          maxLength: 80
          description: Where it is, shown in the details.
          examples: ["http://rpi-io:9000"]
        state:
          enum: [ok, degraded, down, unknown]
          default: unknown
          description: The HMI's colour.
        detail:
          type: [string, "null"]
          maxLength: 80
          examples: [6 devices]
        live:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/AttachedLive"

    AttachedLive:
      description: A little live content, drawn small under the item.
      oneOf:
        - type: object
          required: [type, lines]
          properties:
            type: { const: text }
            lines:
              type: array
              maxItems: 8
              items: { type: string, maxLength: 24 }
        - type: object
          required: [type, items]
          properties:
            type: { const: indicators }
            items:
              type: array
              maxItems: 8
              items:
                type: object
                required: [name, "on"]
                properties:
                  name: { type: string, maxLength: 80 }
                  "on": { type: boolean }
                  color: { enum: [green, red, yellow, blue, white], default: white }
        - type: object
          required: [type, items]
          properties:
            type: { const: values }
            items:
              type: array
              maxItems: 6
              items:
                type: object
                required: [label, value]
                properties:
                  label: { type: string, maxLength: 80 }
                  value: { type: [number, string, "null"] }
                  unit: { type: [string, "null"], maxLength: 80 }
      discriminator:
        propertyName: type

    PluginStatus:
      type: object
      required: [name, version, url, claims, routes, healthy, last_error, attached, attached_error]
      properties:
        name:
          $ref: "#/components/schemas/PluginName"
        version:
          type: [string, "null"]
          description: From the plugin's description.
          examples: [1.0.0]
        url:
          type: [string, "null"]
          description: The plugin's base URL.
          examples: ["http://rpi-io:9000/plugin"]
        claims:
          type: array
          items:
            type: string
          description: The objRefs whose Operate this plugin answers.
        routes:
          type: boolean
          description: Whether the plugin has routes under `/api/plugins/{name}/`.
        healthy:
          type: boolean
          description: |
            False after the plugin's last event or Operate failed or timed out; true again after one
            that succeeds. An unhealthy plugin still gets events.
        last_error:
          type: [string, "null"]
          description: The last error, kept after the plugin is healthy again.
          examples: ["ValueWritten timed out after 5.0s"]
        attached:
          type: array
          items:
            $ref: "#/components/schemas/AttachedItem"
          description: What the plugin attaches (`GET <url>/attached`), checked; the last answer when it didn't answer this time.
        attached_error:
          type: [string, "null"]
          description: Why the last `GET <url>/attached` failed; doesn't change `healthy`.
          examples: ["attached timed out after 1.0s"]

    PluginList:
      type: object
      required: [plugins, failed]
      properties:
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/PluginStatus"
        failed:
          type: object
          description: The plugins that aren't connected, by name, with why; configured ones are tried again.
          additionalProperties:
            type: string
          examples: [{ io: "Can't reach http://rpi-io:9000/plugin: ConnectError(...)" }]

    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          const: true

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  anyOf: [{ type: string }, { type: integer }]
              msg:
                type: string
              type:
                type: string

    # ==================== Plugin configuration ====================

    PluginsConfig:
      x-configuration: true
      type: object
      description: |
        The plugin configuration of an FSP or SO: the file `PLUGINS_FILE` names, or the same JSON in
        `PLUGINS` (whose plugins and `host_url` win). Not sent over HTTP. A bare list stands for
        `{"plugins": [...]}`. `PLUGIN_HOST_URL` wins over `host_url`.
      properties:
        host_url:
          type: [string, "null"]
          description: Where plugins reach this FSP or SO; sent to each plugin as `Host.host_url`.
          examples: ["http://rti-fsp01:5001"]
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/PluginEntry"
      example:
        host_url: http://rti-fsp01:5001
        plugins:
          - name: io
            url: http://rpi-io:9000/plugin
            settings: {}

    PluginEntry:
      type: object
      required: [name, url]
      properties:
        name:
          $ref: "#/components/schemas/PluginName"
        url:
          type: string
          pattern: "^https?://"
          description: The plugin's base URL.
        settings:
          type: object
          additionalProperties: true
          default: {}
