[project]
name = "bff"
version = "0.1.0"
description = "RTI Demo BFF (Backend for Frontend) service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "requests==2.32.5",
    "httpx2>=2.13.0",
    "docker==6.1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bff = ["connections.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated unit tests (no Docker/network required)",
]
