[project]
name = "fsp"
version = "0.1.0"
description = "RTI Demo FSP service (ACSI Server / WebSocket Active)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "httpx2>=2.13.0",
    "python-multipart>=0.0.32",
    "iec61850-websocket",
]

[tool.uv.sources]
iec61850-websocket = { workspace = true }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated unit tests (no Docker/network required)",
]
