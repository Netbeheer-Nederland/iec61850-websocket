server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # The page (index.html, and every app route that falls back to it) is
    # revalidated on each load (a cheap 304 when unchanged), so a rebuilt
    # HMI is picked up straight away. Without a Cache-Control, browsers
    # cached it heuristically and kept loading the previous build's bundle.
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Vite's build output: content-hashed names, so a new build means new
    # names and these can be cached for good (only when found - no "always",
    # so a 404 isn't). A missing one is a 404, not index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The BFF's routes are under /api/ themselves, so the path is passed on
    # as it is - no URI on proxy_pass (a trailing "/" would strip /api/ and
    # turn /api/health into the BFF's nonexistent /health).
    location /api/ {
        proxy_pass http://rti-bff:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
