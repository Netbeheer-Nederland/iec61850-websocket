services:
  # BFF Server
  rti-bff:
    build:
      context: ../..
      dockerfile: examples/rti-demo/modules/bff/docker/Dockerfile
    container_name: rti-bff
    ports:
      - "5000:5000"
    environment:
      - RTI_DOCKER_ENABLED=true
      - RTI_SERVICE_DISCOVERY_ENABLED=true
      - PORT=5000
      - PYTHONUNBUFFERED=1
      # Persist connection state in a dedicated /config dir (named volume below),
      # not in the root-owned WORKDIR /app or the ./modules/bff code mount. The
      # atomic save (temp file + rename in the same dir) needs a real, writable
      # dir - a single-file bind mount would also break os.replace() with EBUSY.
      - BFF_CONNECTIONS_FILE=/config/connections.json
    volumes:
      - ./modules/bff/src/bff:/app/examples/rti-demo/modules/bff/src/bff
      - bff-config:/config
      - //var/run/docker.sock:/var/run/docker.sock
    networks:
      - rti-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    labels:
      - "rti.service=rti-bff"
      - "rti.type=RTI-BFF"
      - "rti.host=rti-bff"
      - "rti.port=5000"

  # HMI Web Server
  rti-hmi:
    build:
      context: hmi
      dockerfile: Dockerfile
    container_name: rti-hmi
    ports:
      - "3001:80"
    depends_on:
      rti-bff:
        condition: service_healthy
    networks:
      - rti-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # RTI-FSP (Acsi-Server)
  rti-fsp01:
    user: root
    build:
      context: ../..
      dockerfile: examples/rti-demo/modules/fsp/docker/Dockerfile
    container_name: rti-fsp01
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - PYTHONUNBUFFERED=1
      - CP=cp1
      - MODELPATH=/models/model_1.py
      - DEMO_IO_URL=http://demo_io:8000
    networks:
      - rti-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=rti-fsp"
      - "rti.type=RTI-FSP"
      - "rti.host=rti-fsp"
      - "rti.port=5001"
    volumes:
        - ./modules/fsp/src/fsp:/app/examples/rti-demo/modules/fsp/src/fsp
        - ./models:/models
        - ./modules/demo_io:/app/demo_IO

  # Second FSP instance
  rti-fsp02:
    user:
      root
    build:
      context: ../..
      dockerfile: examples/rti-demo/modules/fsp/docker/Dockerfile
    container_name: rti-fsp02
    ports:
      - "5005:5005"  # Map to different host port, same container port
    networks:
      - rti-network
    environment:
      - PORT=5005
      - CP=cp2
      - MODELPATH=/models/model_2.py
      - DEMO_IO_URL=http://demo_io:8000
    healthcheck: # ✅ Add healthcheck (optional but recommended)
      test: [ "CMD", "curl", "-f", "http://localhost:5001/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels: # ✅ Add labels for consistency
      - "rti.service=rti-fsp-2"
      - "rti.type=RTI-FSP"
      - "rti.host=rti-fsp-2"
      - "rti.port=5005"
    volumes: # ✅ Add volumes if needed
      - ./modules/fsp/src/fsp:/app/examples/rti-demo/modules/fsp/src/fsp
      - ./models:/models
      - ./modules/demo_io:/app/demo_IO

  # RTI SO (Acsi-Client)
  rti-so:
    user:
      root
    build:
      context: ../..
      dockerfile: examples/rti-demo/modules/so/docker/Dockerfile
    container_name: rti-so
    ports:
      - "5002:5002"
      - "8765:8765"    # WebSocket port - MUST ADD
    environment:
      - PORT=5002
      - PYTHONUNBUFFERED=1
#      - DEMO_IO_URL=http://demo_io:8000
    networks:
      - rti-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5002/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=rti-so"
      - "rti.type=RTI-SO"
      - "rti.host=rti-so"
      - "rti.port=5002"
    volumes:
        - ./modules/so/src/so:/app/examples/rti-demo/modules/so/src/so
        - ./modules/demo_io:/app/demo_IO

  # GPIO LED Control API (demo_IO)
  rti-io:
    build:
      context: modules/demo_io
      dockerfile: docker/Dockerfile
      args:
        PI_USER: ${PI_USER:-pi}
        PI_UID: ${PI_UID:-1000}
        PI_GID: ${PI_GID:-1000}
        GPIO_GID: ${GPIO_GID:-986}
        I2C_GID: ${I2C_GID:-988}
        SPI_GID: ${SPI_GID:-989}
    container_name: demo_io
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    user: ${PI_USER:-pi}  # User with gpio group access
    group_add:
      - "gpio"
      - "i2c"
      - "spi"
 
    devices:
      - "/dev/gpiochip0:/dev/gpiochip0"
      - "/dev/gpiochip4:/dev/gpiochip4"
      - "/dev/gpiochip10:/dev/gpiochip10"
      - "/dev/gpiochip11:/dev/gpiochip11"
      - "/dev/gpiochip12:/dev/gpiochip12"
      - "/dev/gpiochip13:/dev/gpiochip13"
      - "/dev/i2c-1:/dev/i2c-1"
      - "/dev/i2c-13:/dev/i2c-13"
      - "/dev/i2c-14:/dev/i2c-14"
      - "/dev/spidev0.0:/dev/spidev0.0"
      - "/dev/spidev0.1:/dev/spidev0.1"

    ipc: host
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_RAWIO
    networks:
      - rti-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/io/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=demo_io"
      - "rti.type=GPIO-LED-Control"
      - "rti.host=demo_io"
      - "rti.port=8000"
    volumes:
      - ./modules/demo_io:/app/demo_IO
    command: ["./.venv/bin/python", "-u", "demo_IO/io_api_server/main.py"]



networks:
  rti-network:
    driver: bridge

volumes:
  # Persistent BFF runtime state (connections.json), mounted at /config.
  bff-config:
