  # BFF Server
  bff-server:
    build:
      context: .
      dockerfile: Dockerfile.bff
    container_name: bff-server
    ports:
      - "5000:5000"
    environment:
      - RTI_DOCKER_ENABLED=true
      - RTI_SERVICE_DISCOVERY_ENABLED=true
      - PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./bff:/app/bff
      - ./connections.json:/app/connections.json
      - //var/run/docker.sock:/var/run/docker.sock
    networks:
      - rti-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    labels:
      - "rti.service=bff-server"
      - "rti.type=RTI-BFF"
      - "rti.host=bff-server"
      - "rti.port=5000"

  # Frontend Web Server
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend  # or Dockerfile.acsi-ws-server.acsi-ws-client.rti-so.frontend.rti-fsp.bff.front-end
    container_name: rti-demo-ui
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./front-end:/app
    depends_on:
      bff-server:
        condition: service_healthy
    networks:
      - rti-network
    environment:
      - REACT_APP_BFF_URL=http://bff-server:5000

  # RTI-FSP (Acsi-Server)
  rti-fsp:
    build:
      context: ../..
      dockerfile: examples/rti-demo/Dockerfile.rti-fsp
    container_name: rti-fsp
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - PYTHONUNBUFFERED=1
    networks:
      - rti-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=rti-fsp"
      - "rti.type=RTI-FSP"
      - "rti.host=rti-fsp"
      - "rti.port=5001"
    volumes:
        - ./fsp:/app/fsp

  # RTI SO (Acsi-Client)
  rti-so:
    build:
      context: ../..
      dockerfile: examples/rti-demo/Dockerfile.rti-so
    container_name: rti-so
    ports:
      - "5002:5002"
      - "8765:8765"    # WebSocket port - MUST ADD
    environment:
      - PORT=5002
      - PYTHONUNBUFFERED=1
    networks:
      - rti-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5002/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=rti-so"
      - "rti.type=RTI-SO"
      - "rti.host=rti-so"
      - "rti.port=5002"
    volumes:
        - ./so:/app/so

  # RTI WS Client (Acsi-Client)
  active-ws-acsi-client:
    build:
      context: ../..
      dockerfile: examples/rti-demo/Dockerfile.acsi-ws-client
    container_name: active-ws-acsi-client
    ports:
      - "5003:5003"
      - "8766:8765"    # WebSocket port - MUST ADD
    environment:
      - PORT=5003
      - PYTHONUNBUFFERED=1
    networks:
      - rti-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5003/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=active-ws-acsi-client"
      - "rti.type=active-ws-acsi-client"
      - "rti.host=active-ws-acsi-client"
      - "rti.port=5003"
    volumes:
      - ./acsi_ws_client:/app/acsi_ws_client

  # RTI WS Server (Acsi-Server)
  passive-ws-acsi-server:
    build:
      context: ../..
      dockerfile: examples/rti-demo/Dockerfile.acsi-ws-server
    container_name: passive-ws-acsi-server
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - PYTHONUNBUFFERED=1
    networks:
      - rti-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5004/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=passive-ws-acsi-server"
      - "rti.type=passive-ws-acsi-server"
      - "rti.host=passive-ws-acsi-server"
      - "rti.port=5004"
    volumes:
      - ./acsi_ws_server:/app/acsi_ws_server

  # GPIO LED Control API (demo_IO)
  demo_io:
    build:
      context: .
      dockerfile: Dockerfile.IO
    container_name: demo_io
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    devices:
      - "/dev/gpiochip0:/dev/gpiochip0"
      - "/dev/gpiochip1:/dev/gpiochip1"
    privileged: true
    networks:
      - rti-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/io/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=demo_io"
      - "rti.type=GPIO-LED-Control"
      - "rti.host=demo_io"
      - "rti.port=8000"
    volumes:
      - ./demo_IO:/app/demo_IO



networks:
  rti-network:
    driver: bridge

volumes:
  bff-data:
