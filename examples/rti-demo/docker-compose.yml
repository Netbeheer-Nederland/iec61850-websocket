services:
  # BFF Server
  rti-bff:
    build:
      context: ../..
      dockerfile: examples/rti-demo/modules/bff/docker/Dockerfile
    container_name: rti-bff
    ports:
      - "5000:5000"
    environment:
      # PORT/PYTHONUNBUFFERED already set (matching defaults) by the
      # Dockerfile - only override what's actually different here.
      # Persist connection state in a dedicated /config dir (named volume below),
      # not in the root-owned WORKDIR /app or the ./modules/bff code mount. The
      # atomic save (temp file + rename in the same dir) needs a real, writable
      # dir - a single-file bind mount would also break os.replace() with EBUSY.
      - BFF_CONNECTIONS_FILE=/config/connections.json
    volumes:
      - ./modules/bff/src/bff:/app/examples/rti-demo/modules/bff/src/bff
      - bff-config:/config
    networks:
      - rti-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    labels:
      - "rti.service=rti-bff"
      - "rti.type=RTI-BFF"
      - "rti.host=rti-bff"
      - "rti.port=5000"

  # HMI Web Server
  rti-hmi:
    build:
      context: modules/hmi
      dockerfile: docker/Dockerfile
    container_name: rti-hmi
    ports:
      - "3001:80"
    depends_on:
      rti-bff:
        condition: service_healthy
    networks:
      - rti-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # RTI-FSP (Acsi-Server)
  rti-fsp01:
    build:
      context: ../..
      dockerfile: examples/rti-demo/modules/fsp/docker/Dockerfile
    container_name: rti-fsp01
    ports:
      - "5001:5001"
    environment:
      # PORT/PYTHONUNBUFFERED already set (matching defaults) by the Dockerfile.
      - CP=cp1
      - MODELPATH=/models/model_1.py
      - IO_URL=http://rti-io:8000
    networks:
      - rti-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=rti-fsp01"
      - "rti.type=RTI-FSP"
      - "rti.host=rti-fsp01"
      - "rti.port=5001"
    volumes:
        - ./modules/fsp/src/fsp:/app/examples/rti-demo/modules/fsp/src/fsp
        - ./config/models:/models

  # Second FSP instance
  rti-fsp02:
    build:
      context: ../..
      dockerfile: examples/rti-demo/modules/fsp/docker/Dockerfile
    container_name: rti-fsp02
    ports:
      - "5005:5005"  # Map to different host port, same container port
    networks:
      - rti-network
    environment:
      # PORT overrides the Dockerfile's 5001 default - this is a second
      # instance of the same image, on a different port. PYTHONUNBUFFERED
      # already set by the Dockerfile.
      - PORT=5005
      - CP=cp2
      - MODELPATH=/models/model_2.py
      - IO_URL=http://rti-io:8000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5005/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=rti-fsp02"
      - "rti.type=RTI-FSP"
      - "rti.host=rti-fsp02"
      - "rti.port=5005"
    volumes:
      - ./modules/fsp/src/fsp:/app/examples/rti-demo/modules/fsp/src/fsp
      - ./config/models:/models

  # RTI SO (Acsi-Client)
  rti-so:
    build:
      context: ../..
      dockerfile: examples/rti-demo/modules/so/docker/Dockerfile
    container_name: rti-so
    ports:
      - "5002:5002"
      - "8765:8765"    # WebSocket port - MUST ADD
    # PORT/PYTHONUNBUFFERED already set (matching defaults) by the Dockerfile.
    networks:
      - rti-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5002/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=rti-so"
      - "rti.type=RTI-SO"
      - "rti.host=rti-so"
      - "rti.port=5002"
    volumes:
        - ./modules/so/src/so:/app/examples/rti-demo/modules/so/src/so

  # GPIO LED Control API (io)
  rti-io:
    build:
      context: modules/io
      dockerfile: docker/Dockerfile
      args:
        PI_USER: ${PI_USER:-pi}
        PI_UID: ${PI_UID:-1000}
        PI_GID: ${PI_GID:-1000}
        GPIO_GID: ${GPIO_GID:-986}
        I2C_GID: ${I2C_GID:-988}
        SPI_GID: ${SPI_GID:-989}
    container_name: rti-io
    ports:
      - "8000:8000"
    # PORT/PYTHONUNBUFFERED already set (matching defaults) by the Dockerfile.
    user: ${PI_USER:-pi}  # User with gpio group access
    group_add:
      - "gpio"
      - "i2c"
      - "spi"
    devices:
      - "/dev/gpiochip0:/dev/gpiochip0"
      - "/dev/gpiochip4:/dev/gpiochip4"
      - "/dev/gpiochip10:/dev/gpiochip10"
      - "/dev/gpiochip11:/dev/gpiochip11"
      - "/dev/gpiochip12:/dev/gpiochip12"
      - "/dev/gpiochip13:/dev/gpiochip13"
      - "/dev/i2c-1:/dev/i2c-1"
      - "/dev/i2c-13:/dev/i2c-13"
      - "/dev/i2c-14:/dev/i2c-14"
      - "/dev/spidev0.0:/dev/spidev0.0"
      - "/dev/spidev0.1:/dev/spidev0.1"
    ipc: host
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_RAWIO
    networks:
      - rti-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/io/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "rti.service=rti-io"
      - "rti.type=GPIO-LED-Control"
      - "rti.host=rti-io"
      - "rti.port=8000"
    volumes:
      - ./modules/io:/app/io

networks:
  rti-network:
    driver: bridge

volumes:
  # Persistent BFF runtime state (connections.json), mounted at /config.
  bff-config:
