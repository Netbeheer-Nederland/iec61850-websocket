[project]
name = "rti-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.1",
    "asn1tools>=0.169.0",
    "docker==6.1.0",
    "fastapi>=0.139.0",
    "httpx2>=2.13.0",
    "PyJWT[crypto]>=2.0.0,<3.0.0",
    "python-dotenv==1.0.0",
    "python-multipart>=0.0.32",
    "requests==2.32.5",
    "smbus2>=0.6.1",
    "uvicorn>=0.51.0",
    "websockets>=16.1",
]

[dependency-groups]
dev = [
    "pytest >= 9.0.0",
    "pytest-asyncio >= 1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated unit tests (no Docker/network required)",
    "integration: integration tests requiring live Docker containers",
]
