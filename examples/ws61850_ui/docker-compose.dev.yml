#
# Development overrides — hot-reload for both BFF and UI.
#
# Usage (from this directory):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# The UI Vite dev server runs on http://localhost:5173
# The BFF Flask dev server runs on http://localhost:8000
# Both reload automatically when source files change.

services:

  # ── Vite dev server with HMR ─────────────────────────────────────────────────
  ui:
    build: null        # skip the multi-stage build
    image: node:22-alpine
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ../../examples/ws61850_ui/ui:/app
      - ui_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_WS_URL: ${VITE_WS_URL:-mock://demo}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-IEC 61850 UI (dev)}
      VITE_EVENT_BUFFER_SIZE: ${VITE_EVENT_BUFFER_SIZE:-5000}
    depends_on: {}   # no nginx healthcheck dependency in dev

  # ── Flask dev server with auto-reload ────────────────────────────────────────
  bff:
    command: >
      sh -c "pip install --quiet watchdog &&
             python -m flask --app app run
               --host 0.0.0.0 --port 8000 --debug --reload"
    volumes:
      - ../../examples/ws61850_ui/bff:/app/bff
      - ../../examples/ws61850_ui/app.py:/app/app.py
      - ../../src:/build/src      # pick up library changes without rebuild
    environment:
      FLASK_ENV: development
      WS61850_GUI_LOG_LEVEL: DEBUG

volumes:
  ui_node_modules:
