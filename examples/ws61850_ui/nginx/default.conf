server {
    listen 80;
    server_name _;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Health check endpoint (handled by Nginx itself)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Proxy REST API to the BFF service
    location /api/ {
        proxy_pass         http://bff:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Serve the React SPA — all other paths fall back to index.html
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;

        # Cache-bust: no-cache for index.html so updated bundles are picked up
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Long-lived cache for hashed assets (Vite appends content hash)
        location ~* \.(js|css|woff2?|svg|png|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
