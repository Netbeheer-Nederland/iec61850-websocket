#
# Production compose — build context is the repo root.
#
# Run from repo root:
#   docker compose -f examples/ws61850_ui/docker-compose.yml up --build
#
# Or from this directory:
#   docker compose up --build
#
# Demo topology:
#
#   ┌──────────────────────────────────────────────────────────────────────┐
#   │  RTI-SO  (ws_server + iec_client)          port 9100                 │
#   │  Accepts connections from RTI-FSP / BFF client-server target         │
#   └─────────────────────────┬────────────────────────────────────────────┘
#                             │ ws (RTI-FSP dials in)
#   ┌─────────────────────────▼─────────────────────────────────────────── ┐
#   │  RTI-FSP (ws_client + iec_server)                                    │
#   │  Dials to RTI-SO, serves an IEC 61850 data model                     │
#   └──────────────────────────────────────────────────────────────────────┘
#
#   ┌──────────────────────────────────────────────────────────────────────┐
#   │  RTI-BFF (Flask REST API)                  port 8000 (REST)          │
#   │                                            port 9000 (ws_server)     │
#   │  rti-so  target: ws_server + iec_client  ← RTI-FSP can connect here  │
#   │  rti-fsp target: ws_client + iec_server  → dials to RTI-SO:9100      │
#   └──────────────────────────┬───────────────────────────────────────────┘
#                              │ /api/
#   ┌──────────────────────────▼───────────────────────────────────────────┐
#   │  UI  (React SPA + Nginx)                   port 80                   │
#   └──────────────────────────────────────────────────────────────────────┘

services:

  # ── React SPA served by Nginx, proxies /api/ to the BFF ─────────────────────
  ui:
    build:
      context: ../..
      dockerfile: examples/ws61850_ui/Dockerfile.ui
      args:
        VITE_APP_TITLE: ${VITE_APP_TITLE:-RTI Demo UI}
        VITE_EVENT_BUFFER_SIZE: ${VITE_EVENT_BUFFER_SIZE:-5000}
    image: ws61850-ui:latest
    ports:
      - "${UI_PORT:-8185}:80"
    depends_on:
      bff:
        condition: service_healthy
    restart: unless-stopped

  # ── RTI-BFF: Python Backend-for-Frontend (Flask REST API) ─────────────────────
  bff:
    build:
      context: ../..
      dockerfile: examples/ws61850_ui/Dockerfile.bff
    image: ws61850-bff:latest
    environment:
      PORT: "8000"
      WS61850_GUI_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # HTTP REST API — used by Nginx proxy and direct curl access.
      - "${BFF_PORT:-8100}:8000"
      # IEC WebSocket port for the rti-so target (ws_server + iec_client).
      # RTI-FSP connects here when you POST /api/connect with is_server=true.
      - "${BFF_SO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── RTI-SO: Headless ws_server + iec_client ──────────────────────────────────
  # Listens for incoming ws_client connections (from RTI-FSP or BFF rti-fsp target).
  # To connect the BFF to it:
  #   POST /api/connect {"target":"rti-fsp","url":"rti-so","port":9100,"cp":"cp1","application_role":"iec_server"}
  rti-so:
    build:
      context: ../..
      dockerfile: examples/ws61850_ui/Dockerfile.rti-so
    image: ws61850-rti-so:latest
    environment:
      IEC_HOST: "0.0.0.0"
      IEC_PORT: "8765"
      IEC_CP: "${RTI_SO_CP:-cp1,cp2}"
      IEC_POLL_INTERVAL: "${RTI_SO_POLL_INTERVAL:-30}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      - "${RTI_SO_PORT:-8765}:8765"
    restart: unless-stopped

  # ── RTI-FSP: Headless ws_client + iec_server ─────────────────────────────────
  # Dials out to RTI-SO and serves an IEC 61850 data model.
  # Can also be pointed at the BFF rti-so port (BFF_SO_PORT).
  rti-fsp:
    build:
      context: ../..
      dockerfile: examples/ws61850_ui/Dockerfile.rti-fsp
    image: ws61850-rti-fsp:latest
    environment:
      FSP_TARGET_HOST: "${FSP_TARGET_HOST:-rti-so}"
      FSP_TARGET_PORT: "${FSP_TARGET_PORT:-8765}"
      FSP_CP: "${FSP_CP:-cp1}"
      FSP_MODEL: "${FSP_MODEL:-1}"
      FSP_UPDATE_INTERVAL: "${FSP_UPDATE_INTERVAL:-15}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      - rti-so
    restart: unless-stopped
