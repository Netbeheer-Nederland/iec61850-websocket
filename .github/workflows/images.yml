name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Turn the diff into a JSON list of images to build. On a tag or a manual
  # dispatch the list is forced to all seven.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            lib: &lib
              - 'src/ws61850/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/images.yml'
            rti: &rti
              - *lib
              # bff/fsp/so are now workspace members - the shared root
              # pyproject.toml/uv.lock is what actually pins their deps
              # (examples/rti-demo no longer has its own).
            so:          [ *rti, 'examples/rti-demo/modules/so/**',  'examples/rti-demo/modules/so/pyproject.toml' ]
            fsp:         [ *rti, 'examples/rti-demo/modules/fsp/**', 'examples/rti-demo/modules/fsp/pyproject.toml' ]
            acsi_client: [ *rti, 'examples/rti-demo/acsi_ws_client/**', 'examples/rti-demo/Dockerfile.acsi-ws-client' ]
            acsi_server: [ *rti, 'examples/rti-demo/acsi_ws_server/**', 'examples/rti-demo/Dockerfile.acsi-ws-server' ]
            bff:         [ 'examples/rti-demo/modules/bff/**', 'pyproject.toml', 'uv.lock' ]
            io:          [ 'examples/rti-demo/modules/io/**' ]
            hmi:         [ 'examples/rti-demo/modules/hmi/**' ]

      - id: set
        env:
          FIRED: ${{ toJSON(steps.f.outputs) }}
        run: |
          force=${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
          out='[]'
          for k in so fsp acsi_client acsi_server bff io hmi; do
            hit=$(jq -r --arg k "$k" '.[$k] // "false"' <<<"$FIRED")
            if [ "$force" = true ] || [ "$hit" = true ]; then
              out=$(jq -c --arg k "$k" '. + [$k]' <<<"$out")
            fi
          done
          echo "matrix={\"image\":$out}" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.matrix != '{"image":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - id: img
        run: |
          case "${{ matrix.image }}" in
            so)          c=. ; f=examples/rti-demo/modules/so/docker/Dockerfile  ; n=ws61850-so ;;
            fsp)         c=. ; f=examples/rti-demo/modules/fsp/docker/Dockerfile ; n=ws61850-fsp ;;
            acsi_client) c=. ; f=examples/rti-demo/Dockerfile.acsi-ws-client ; n=ws61850-acsi-ws-client ;;
            acsi_server) c=. ; f=examples/rti-demo/Dockerfile.acsi-ws-server ; n=ws61850-acsi-ws-server ;;
            bff)         c=. ; f=examples/rti-demo/modules/bff/docker/Dockerfile ; n=rti-demo-bff ;;
            io)          c=examples/rti-demo/modules/io ; f=docker/Dockerfile ; n=rti-demo-io ; p=linux/amd64,linux/arm64 ;;
            hmi)         c=examples/rti-demo/modules/hmi ; f=docker/Dockerfile ; n=rti-demo-hmi ;;
          esac
          {
            echo "ctx=$c"
            echo "file=$f"
            echo "name=$n"
            echo "platforms=${p:-linux/amd64}"
          } >> "$GITHUB_OUTPUT"

      - if: contains(steps.img.outputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

