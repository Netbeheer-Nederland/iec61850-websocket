name: CI

# Every push is checked, so long-lived branches without a pull request (such as
# an integration branch) get CI too. Pull requests are checked only when they
# target main; one into another branch is covered by that branch's push runs.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          # One cache key per job: jobs running in parallel with the same key
          # race to save it ("Unable to reserve cache ... another job").
          cache-suffix: lint
      - run: uv sync --locked            # dev group is synced by default
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-suffix: test-${{ matrix.python }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest tests/unit -q --junitxml=junit-${{ matrix.python }}.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.python }}
          path: junit-*.xml

  # The rti-demo modules' tests and the rti-plugins' tests, as
  # examples/rti-demo/TESTING.md runs them. The IO server isn't a workspace
  # member; its tests run in the fsp environment, which has FastAPI. Its
  # plugin is. sim_leds is a downloadable plugin, tested in the host's env.
  rti-demo-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-suffix: rti-demo-modules
      - run: uv sync --locked --all-packages
      - run: uv run --package bff pytest examples/rti-demo/modules/bff/tests -m unit -q
      - run: uv run --package acsi-plugins pytest examples/rti-demo/modules/plugins/tests -m unit -q
      - run: uv run --package fsp pytest examples/rti-demo/modules/fsp/tests -m unit -q
      - run: uv run --package so pytest examples/rti-demo/modules/so/tests -m unit -q
      - run: uv run --package acsi-io-plugin pytest examples/rti-plugins/io/plugin/tests -m unit -q
      - run: uv run --package fsp pytest examples/rti-plugins/io/server/tests -m unit -q
      - run: uv run --package acsi-plugins pytest examples/rti-plugins/sim_leds/tests -m unit -q

  # The HMI's tests and production build (vite), with the Node version its
  # Docker image builds with (modules/hmi/docker/Dockerfile).
  hmi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/rti-demo/modules/hmi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.9.0"
          cache: npm
          cache-dependency-path: examples/rti-demo/modules/hmi/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx vite build

  # Copyright and license information on every file (REUSE spec; REUSE.toml
  # covers files that can't carry a header).
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  # Both compose stacks parse and resolve as Docker Compose reads them: the
  # demo's, and the IO server's with and without its no-devices overlay
  # (decision 0028). The overlay's !reset needs Compose 2.24 or later.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose version
      - run: docker compose config -q
        working-directory: examples/rti-demo
      - run: docker compose config -q
        working-directory: examples/rti-plugins/io/server
      - run: docker compose -f docker-compose.yml -f docker-compose.no-devices.yml config -q
        working-directory: examples/rti-plugins/io/server

  # Relative links and #anchors in the Markdown docs (config: lychee.toml).
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml '**/*.md'
          fail: true

  # The first-run check from docs/getting-started.md, so it can't break unnoticed.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-suffix: smoke
      - run: uv sync --locked
      - run: scripts/smoke-test.sh

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-suffix: build
      - run: uv build                    # -> dist/iec61850_websocket-<ver>.whl + .tar.gz
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
